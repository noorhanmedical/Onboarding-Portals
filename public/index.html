<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plexus Onboarding — My Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--canvas:hsl(208 50% 94%);--line:hsl(207 40% 86%);--ink:hsl(218 55% 15%);--muted:hsl(220 14% 45%);--card:#fff;--soft:hsl(205 50% 95%);--field:hsl(208 34% 80%);
--accent:hsl(212 72% 36%);--accent-soft:hsl(205 85% 95%);--accent-line:hsl(205 60% 82%);--surface:hsla(205,60%,99%,.82);--ice:hsl(198 80% 92%);--frost:hsl(205 70% 97%);
--green:hsl(152 40% 32%);--green-soft:hsl(150 45% 94%);--amber:hsl(36 70% 32%);--amber-soft:hsl(40 85% 93%);--red:hsl(6 55% 42%);--red-soft:hsl(6 70% 96%);--blue:hsl(214 60% 40%);--blue-soft:hsl(214 70% 95%)}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;background:radial-gradient(1200px 500px at 85% -10%,hsla(195,90%,85%,.55),transparent 60%),radial-gradient(900px 500px at -10% 30%,hsla(220,80%,88%,.5),transparent 60%),linear-gradient(180deg,hsl(205 60% 96%),hsl(212 45% 92%));background-attachment:fixed;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid hsl(236 60% 60%);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* app bar */
.bar{position:fixed;inset:0 0 auto;height:56px;z-index:50;background:linear-gradient(90deg,hsl(222 65% 12%),hsl(214 70% 22%) 60%,hsl(200 70% 30%));color:#eef6ff;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #222}
.bar .ctx{flex:1;min-width:0}.bar .ctx small{display:block;font-size:10.5px;letter-spacing:.14em;color:#999;text-transform:uppercase}.bar .ctx strong{font-weight:300;font-size:15px}
.bar select,.bar button{background:hsla(210,60%,90%,.08);border:1px solid hsla(200,80%,85%,.25);color:#eee;border-radius:8px;height:34px;padding:0 10px;font-size:13px}
.bar .views{display:flex;gap:4px;background:hsla(215,60%,8%,.35);border:1px solid hsla(200,80%,85%,.2);border-radius:9px;padding:3px}
.bar .views button{border:0;background:none;height:28px}.bar .views button.on{background:hsl(198 85% 90%);color:hsl(218 60% 18%)}
main{max-width:1180px;margin:0 auto;padding:76px 24px 60px}
/* winter */
.hero::after{content:none}
.sec>h2 button::after{content:none;position:absolute;right:58px;top:50%;transform:translateY(-50%);font-size:34px;color:hsla(0,0%,100%,.09);pointer-events:none}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.snow i{position:absolute;top:-12px;color:hsla(205,80%,70%,.45);font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(30px,105vh,0) rotate(220deg)}}
main{position:relative;z-index:1}
.card{box-shadow:0 1px 2px hsla(210,60%,30%,.05)}
.access-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.access{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent-line)}
.access.admin{background:linear-gradient(180deg,hsl(214 70% 96%),hsl(214 60% 99%))}.access.regular{background:linear-gradient(180deg,hsl(195 75% 95%),hsl(195 60% 99%))}
.access-h b{display:block;font-weight:600;font-size:14px;color:hsl(214 60% 28%)}.access-h span{font-size:12px;color:var(--muted)}
.pw{display:flex;align-items:center;gap:6px}.pw input{flex:1}
@media(max-width:860px){.access-grid{grid-template-columns:1fr}}
/* ---- iOS bento design system ---- */
:root{--warm:#fffdf9;--lav:hsl(250 70% 97%);--lav-2:hsl(250 55% 92%);--lav-ink:hsl(250 38% 46%);--navy:hsl(220 55% 18%);--bluegray:hsl(215 18% 46%);--r-card:18px;--r-ctl:12px}
.grp{display:flex;flex-direction:column;gap:12px}
.grp-h{display:flex;align-items:center;gap:11px}.grp-h h3{margin:0;font-size:17px;font-weight:600;color:var(--navy);letter-spacing:-.01em}.grp-h p{margin:1px 0 0;font-size:12.5px;color:var(--bluegray)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,hsl(208 80% 95%),var(--lav));color:hsl(218 60% 34%);flex-shrink:0;box-shadow:inset 0 0 0 1px hsla(214,60%,60%,.12)}
.ico.sm{width:30px;height:30px;border-radius:9px}
.bento{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}.bento.c1{grid-template-columns:1fr}.bento.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;min-height:132px;padding:16px 16px 14px;background:var(--warm);border:1px solid hsl(210 30% 90%);border-radius:var(--r-card);box-shadow:0 1px 2px hsla(215,40%,30%,.04),0 8px 24px -12px hsla(215,50%,35%,.14);cursor:pointer;text-align:left;transition:transform .18s ease,box-shadow .18s ease,border-color .18s;min-width:0}
.tile:hover{transform:translateY(-1px);border-color:hsl(212 55% 82%);box-shadow:0 1px 2px hsla(215,40%,30%,.05),0 14px 30px -14px hsla(215,60%,35%,.24)}
.tile:focus-visible{outline:2px solid hsl(212 70% 55%);outline-offset:2px}
.tile.span{grid-column:1/-1}
.tile-top{display:flex;align-items:center;gap:10px}.tile-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile-title b{font-size:16px;font-weight:600;color:var(--navy);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11.5px;font-weight:500;color:var(--lav-ink);background:var(--lav);border:1px solid var(--lav-2);padding:1px 8px;border-radius:99px;white-space:nowrap}
.chev-r{color:hsl(215 20% 62%);display:inline-flex;transition:transform .18s}.tile:hover .chev-r{transform:translateX(2px);color:hsl(214 55% 45%)}
.tile-lines{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:hsl(218 30% 26%);min-width:0}.tile-lines span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-lines span+span{color:var(--bluegray);font-size:13px}
.tile-status{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--bluegray)}
.tile-status.ok{color:var(--green)}.tile-status.warn{color:hsl(32 70% 36%)}.tile-status.info{color:hsl(214 60% 40%)}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.tile.editing{grid-column:1/-1;cursor:default;min-height:0;padding:0;gap:0;background:linear-gradient(180deg,hsla(0,0%,100%,.96),hsla(205,70%,98%,.94));backdrop-filter:blur(10px);border-color:hsl(212 55% 82%);box-shadow:0 1px 2px hsla(215,40%,30%,.05),0 20px 40px -20px hsla(215,60%,35%,.3)}
.tile.editing:hover{transform:none}
.ed-h{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid hsl(210 30% 91%)}.ed-t{flex:1;display:flex;flex-direction:column}.ed-t b{font-size:16px;font-weight:600;color:var(--navy)}.ed-t span{font-size:12px;color:var(--bluegray)}
.ed-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.eg{border:1px solid hsl(210 30% 91%);border-radius:14px;background:hsla(0,0%,100%,.7)}
.eg>summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px}
.eg>summary::-webkit-details-marker{display:none}
.eg>summary::before{content:'';width:7px;height:7px;border-right:1.6px solid hsl(215 20% 55%);border-bottom:1.6px solid hsl(215 20% 55%);transform:rotate(-45deg);transition:transform .18s;margin-right:2px}
.eg[open]>summary::before{transform:rotate(45deg)}
.eg>.grid,.eg>.stack{padding:2px 14px 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.addtile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:132px;padding:16px;border-radius:var(--r-card);border:1.5px dashed hsl(245 40% 82%);background:linear-gradient(160deg,#fff,var(--lav));color:var(--lav-ink);cursor:pointer;text-align:center;transition:border-color .18s,background .18s,transform .18s}
.addtile:hover:not(:disabled){border-color:hsl(245 50% 66%);background:linear-gradient(160deg,#fff,var(--lav-2));transform:translateY(-1px)}
.addtile:focus-visible{outline:2px solid hsl(245 60% 60%);outline-offset:2px}.addtile:disabled{opacity:.5;cursor:not-allowed}
.addtile .plus{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--lav-2),0 6px 14px -8px hsla(250,50%,45%,.5);color:var(--lav-ink)}
.addtile b{font-size:14.5px;font-weight:600;color:var(--navy)}.addtile .hint{font-size:12.5px;color:var(--bluegray)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:132px;border-radius:var(--r-card);border:1px dashed hsl(210 30% 84%);color:var(--bluegray);font-size:13.5px;text-align:center;padding:16px;background:hsla(0,0%,100%,.5)}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:hsl(210 30% 96%);color:var(--bluegray)}.search input{border:0;background:transparent;box-shadow:none!important;padding:9px 0}
.ioslist{list-style:none;margin:0;padding:0;border-radius:14px;background:#fff;border:1px solid hsl(210 30% 91%);overflow:hidden}
.ioslist li+li{border-top:1px solid hsl(210 30% 93%)}
.iosrow{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:14px;cursor:pointer}.iosrow input{position:absolute;opacity:0;width:1px;height:1px}
.iosrow:hover{background:hsl(208 60% 97%)}.iosrow span{flex:1}.iosrow .tick{display:inline-flex;color:hsl(214 70% 42%);font-style:normal;width:16px}
.iosrow:focus-within{box-shadow:inset 0 0 0 2px hsl(212 70% 60%)}.iosrow.on{color:var(--navy);font-weight:500}
.plist{background:hsla(0,0%,100%,.75);backdrop-filter:blur(8px);border-radius:18px}
.sec.open .body{background:linear-gradient(180deg,hsla(205,70%,98%,.6),transparent 240px)}
@media(max-width:860px){.bento,.bento.c3{grid-template-columns:1fr}.tile,.addtile{min-height:112px}}
@media(prefers-reduced-motion:reduce){.tile,.addtile,.chev-r{transition:none}.tile:hover,.addtile:hover{transform:none}}

/* ---- typography & density refinement ---- */
.signin-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,hsl(214 70% 96%),hsl(260 60% 97%))}
.signin{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 50px hsla(215,50%,30%,.12);display:flex;flex-direction:column;gap:14px}
.signin h1{margin:6px 0 0;font-size:26px}.signin p{margin:0;font-size:15.5px;line-height:1.5}.si-brand{display:flex;gap:12px;align-items:center}.si-brand b{display:block;font-size:16px}.si-brand span{font-size:13.5px;color:var(--bluegray)}
.si-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,hsl(214 70% 40%),hsl(265 55% 50%));color:#fff!important;display:grid;place-items:center;font-weight:700;font-size:18px}
.si-ws{justify-content:center;border:1.5px solid hsl(214 64% 45%);color:hsl(214 64% 35%);background:hsl(214 90% 97%)}.si-err{color:var(--red);font-size:14.5px}.si-demo{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}.si-demo .chip{font-size:13.5px}
.signin .btn.billing{background:hsl(270 52% 44%);border-color:hsl(270 52% 44%)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}.who-n{display:flex;flex-direction:column;align-items:flex-end;font-size:13.5px;color:#fff;line-height:1.2}.who-n small{font-size:11.5px;color:hsl(198 85% 85%)}.signout{color:hsl(198 85% 88%)!important;font-size:13.5px}
@media(max-width:640px){.who-n{display:none}}
.reqpanel{margin:0 0 16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;text-align:left}.reqpanel h3{margin:0;font-size:18px}
.req-tabs{display:flex;gap:8px}.req-tab{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;font-weight:500}.req-tab.clinic.on{background:hsl(214 64% 45%);border-color:hsl(214 64% 45%);color:#fff}.req-tab.billing.on{background:hsl(270 52% 46%);border-color:hsl(270 52% 46%);color:#fff}
.req-actions{gap:8px}.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.req-sec{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}.req-sec>b{font-size:15px;padding:2px 4px 6px}
.req-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid hsl(210 30% 94%);font-size:14.5px}.req-row:focus-visible{outline:2px solid hsl(210 90% 60%);border-radius:8px}
.req-v{font-size:12.5px;color:var(--bluegray);min-width:58px;text-align:right}.req-row.on .req-v{color:var(--navy);font-weight:600}
.req-c{font-style:normal;font-size:11px;font-weight:600;color:hsl(32 80% 38%);background:hsl(40 100% 93%);border-radius:6px;padding:1px 6px;margin-left:6px}
.sw{width:38px;height:22px;border-radius:999px;background:hsl(214 20% 82%);position:relative;transition:background .15s}.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px hsla(0,0%,0%,.25);transition:left .15s}
.sw.on i{left:18px}.sw.clinic.on{background:hsl(214 64% 45%)}.sw.billing.on{background:hsl(270 52% 46%)}
.iosrow.other{font-style:italic}
.acc-check{display:flex;align-items:center;gap:8px;cursor:pointer}.acc-check input{width:20px;height:20px;min-height:0;accent-color:hsl(224 72% 40%);margin:0}.access.regular .acc-check input,.acc-check.regular input{accent-color:hsl(168 58% 34%)}
.access.off{border:1.5px solid hsl(214 20% 85%)!important;background:hsl(210 20% 97%)!important}.access.off .acc-tag{background:hsl(214 14% 62%)!important}.access.off .access-h b{color:hsl(214 15% 45%)!important}
.tile.acc-off{border:1.5px solid hsl(214 20% 85%);background:hsl(210 20% 97%)}.tile.acc-off .ico{background:hsl(214 20% 90%);color:hsl(214 15% 45%)}
.acc-pick{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--navy)}
.tile-wrap{position:relative;display:flex}.tile-wrap>.tile{flex:1;min-width:0}.tile-wrap>.trash,.tile-wrap>.trash-ask{position:absolute;right:12px;top:16px}
.trash{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;color:hsl(214 15% 55%)}.trash:hover{background:hsl(0 80% 96%);color:var(--red)}.trash:focus-visible{outline:2px solid hsl(210 90% 60%)}
.trash-ask{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;font-size:14px;box-shadow:0 6px 18px hsla(215,40%,30%,.15);z-index:2}
.tile-wrap .ptile .tile-top{padding-right:34px}
.access.admin{border:2px solid hsl(224 72% 40%);background:linear-gradient(180deg,hsl(224 90% 96%),hsl(224 80% 99%))}
.access.regular{border:2px solid hsl(168 58% 34%);background:linear-gradient(180deg,hsl(160 60% 95%),hsl(160 50% 99%))}
.access.admin .access-h b{color:hsl(224 70% 28%)}.access.regular .access-h b{color:hsl(168 65% 22%)}
.access-h b{display:flex;align-items:center;gap:8px}
.acc-tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff!important}.acc-tag.admin{background:hsl(224 72% 40%)}.acc-tag.regular{background:hsl(168 58% 34%)}
.access.admin .choice.on{border-color:hsl(224 72% 40%);background:hsl(224 90% 93%)}.access.regular .choice.on{border-color:hsl(168 58% 34%);background:hsl(160 60% 90%)}
.tile.acc-admin{border:2px solid hsl(224 72% 40%);background:linear-gradient(180deg,hsl(224 90% 97%),#fff)}.tile.acc-regular{border:2px solid hsl(168 58% 34%);background:linear-gradient(180deg,hsl(160 60% 96%),#fff)}
.tile.acc-admin .ico{background:hsl(224 72% 40%);color:#fff}.tile.acc-regular .ico{background:hsl(168 58% 34%);color:#fff}
.tile.acc-admin .tile-title b{color:hsl(224 70% 28%)}.tile.acc-regular .tile-title b{color:hsl(168 65% 22%)}
.pref-note{grid-column:1/-1;display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:14px;background:hsl(205 100% 95%);border:1px solid hsl(205 80% 82%);color:hsl(212 70% 28%);font-size:15px;line-height:1.45}.pref-note b{font-weight:600}.pref-note svg{margin-top:2px;flex-shrink:0}
.access-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.access-pair .access{height:100%;box-sizing:border-box}@media(max-width:760px){.access-pair{grid-template-columns:1fr}}
.rdash .hero-top{align-items:flex-start}.rcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}@media(max-width:760px){.rcards{grid-template-columns:1fr}}
.rcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:#fff;transition:box-shadow .15s,border-color .15s}
.rcard:hover{box-shadow:0 6px 20px hsla(215,50%,30%,.1)}.rcard:focus-visible{outline:3px solid hsl(210 90% 60%);outline-offset:2px}
.rcard.clinic.on{border-color:hsl(214 64% 45%);box-shadow:0 0 0 3px hsla(214,64%,50%,.15)}.rcard.billing.on{border-color:hsl(270 52% 50%);box-shadow:0 0 0 3px hsla(270,52%,50%,.15)}
.rc-h{display:flex;justify-content:space-between;align-items:baseline}.rc-h b{font-size:18px;font-weight:600}.rc-pct{font-size:26px;font-weight:600;color:var(--navy)}
.rcard.billing .rc-h b,.rcard.billing .rc-pct{color:hsl(268 50% 34%)}.rcard.billing .track span{background:linear-gradient(90deg,hsl(270 52% 50%),hsl(285 60% 60%))}
.rc-m{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14.5px;color:var(--bluegray)}.rc-m b{color:var(--navy);font-weight:600}.warn-t,.warn-t b{color:var(--amber)!important}
.rc-f{font-size:14px;color:var(--bluegray);line-height:1.4}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:118px}.acts .btn{justify-content:center;white-space:nowrap}.invpanel{margin-top:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}.invpanel h3{margin:0;font-size:18px}.invgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:860px){.invgrid{grid-template-columns:1fr}}
.invbox{background:#fff;border:1px solid var(--line);border-left:4px solid hsl(214 64% 45%);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.invbox.billing{border-left-color:hsl(270 52% 50%)}
.invbox-h{display:flex;justify-content:space-between;align-items:baseline}.invbox-h b{font-size:16px}.invbox-h span{font-size:13.5px;color:var(--bluegray)}
.inv-add{flex-wrap:nowrap;gap:8px}.inv-add input{flex:1;min-width:0}.invbox.billing .btn.pri{background:hsl(270 52% 44%);border-color:hsl(270 52% 44%)}
.invlist .danger-link{align-self:center}.inv-rows{display:flex;flex-direction:column;gap:8px}.inv-row{display:grid;grid-template-columns:1fr 1.3fr 24px;gap:8px;align-items:center}.inv-row input{min-width:0}.invlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}.invlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid hsl(210 30% 93%);flex-wrap:wrap}.inv-e{flex:1;font-size:15px;min-width:160px}

function status(s){
  const secs=SECTIONS.map(([k,label])=>{const t=s.tasks[k]||{state:'not_started',reason:''};const bt=s.tasks[base(k)];const items=checks(s,k);return {k,label,state:t.state==='not_started'&&ALIAS[k]&&bt.state!=='not_started'?(bt.state==='submitted'?'saved':bt.state):t.state,reason:t.reason,items,clinic:items.filter(i=>i[0]==='clinic')};});
  secs.forEach(x=>{x.complete=x.state==='na'||['verified','waived'].includes(x.state)||!x.clinic.length;});
  const done=secs.filter(x=>x.complete).length,submitted=secs.every(x=>['submitted','na','verified','waived'].includes(x.state));
  const stage=secs.every(x=>['verified','waived'].includes(x.state))?2:submitted?1:0;
  return {secs,done,pct:Math.round(done/SECTIONS.length*100),stage,submitted,review:secs.filter(x=>['submitted','na'].includes(x.state)).length};
}

function fmtDays(days=[]){if(!days.length)return '';const idx=days.map(d=>DAYS.indexOf(d)).sort((a,b)=>a-b);const runs=[];let st=idx[0],pv=idx[0];
  for(const i of idx.slice(1)){if(i===pv+1){pv=i;continue;}runs.push([st,pv]);st=pv=i;}runs.push([st,pv]);
  return runs.map(([a,b])=>b-a>=2?`${DAYS[a]}–${DAYS[b]}`:a===b?DAYS[a]:`${DAYS[a]}, ${DAYS[b]}`).join(', ');}

  return html`${bar}<main>

      <div class="hero-top"><div><button type="button" class="link back" onClick=${()=>{setView('console');scrollTo(0,0);}}>← Back to console</button><p class="eyebrow">${s.clinic} · Plexus review</p><h1>${s.site}</h1><button class=${'btn sm'+(reqFac?' pri':'')} style="margin-top:8px" onClick=${()=>setReqFac(!reqFac)}>${Icon('check',14)} Requirements for this facility${Object.values(s.reqOverride||{}).reduce((a,o)=>a+Object.keys(o).length,0)?' · customized':''}</button></div>
        <div class=${'save'+(!saving&&saved?' ok':'')} aria-live="polite">${saving?'Saving…':saved?'✓ Saved':''}</div></div>
      ${reqFac&&html`<${ReqEditor} s=${s} setS=${setS} mode="facility" onClose=${()=>setReqFac(false)}/>`}
      <div class="rcards" role="tablist" aria-label="Onboarding teams">${[['clinic','Clinic onboarding',CLIN,'clinic'],['billing','Billing onboarding',BILL,'billing']].map(([t,l,G,team])=>{const x=teamStat(G),inv=((s.invites||{})[s.site]||{})[team]||[];
        return html`<button type="button" role="tab" aria-selected=${rtab===t} class=${'rcard '+t+(rtab===t?' on':'')} onClick=${()=>{setRtab(t);setOpen({});}}>
          <span class="rc-h"><b>${l}</b><span class="rc-pct">${x.pct}%</span></span>
          <span class="track"><span style=${`width:${x.pct}%`}/></span>
          <span class="rc-m"><span><b>${x.d}</b>/${x.n} complete</span><span><b>${x.sub}</b> submitted</span><span><b>${x.ver}</b> verified</span>${x.chg?html`<span class="warn-t"><b>${x.chg}</b> changes requested</span>`:''}</span>
          <span class="rc-f">${x.xs.filter(y=>!y.complete).length?`Still open: ${x.xs.filter(y=>!y.complete).map(y=>y.label).join(', ')}`:'All sections complete'}</span>
          <span class="rc-f">${inv.length?`Team: ${inv.map(i=>i.name||i.email).join(', ')}`:'No one invited yet'}</span>
        </button>`;})}</div>
    </section>`:html`
    <section class="hero">
      <div class="hero-top"><div><p class="eyebrow">${s.clinic}${view==='review'?' · Plexus review':''}</p><h1>${view==='review'?'Plexus Review':view==='billing'?'Billing Onboarding':'Clinic Onboarding'}</h1></div>
        <label class="field" style="min-width:210px"><span class="lbl">Facility</span><select><option>${s.site}</option></select></label></div>
      <div class="stats">
        <div class="pct"><strong>${vpct}%</strong><span>complete</span></div>
        <div><div class="track" role="progressbar" aria-label="Completed sections" aria-valuenow=${vpct} aria-valuemin="0" aria-valuemax="100"><span style=${`width:${vpct}%`}/></div>
          <p><b>${vdone}</b> of ${VIS.length} sections complete${vsub?' · submitted for review':''}</p></div>
        <ol class="stages" aria-label="Onboarding stage">${[view==='billing'?'Billing Completing':view==='review'?'Teams Completing':'Clinic Completing','Plexus Reviewing','Ready to Launch'].map((x,i)=>html`<li class=${i<vstage?'done':i===vstage?'cur':''} aria-current=${i===vstage?'step':undefined}><i>${i<vstage?'✓':i+1}</i>${x}</li>`)}</ol>
        <div class=${'save'+(!saving&&saved?' ok':'')} aria-live="polite">${saving?'Saving…':saved==='mem'?'Saved for this session (browser storage unavailable)':saved?`✓ All changes saved · ${saved.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · this browser only`:'Changes save automatically'}</div>
      </div>
      ${vstage===2&&html`<div class="note ok" style="margin-top:10px">Every section is verified. Launch approval still requires startup, training and the Plexus launch dry run.</div>`}
    </section>`}
    <nav class="tabs" ref=${tabsRef} aria-label="My Progress sections"><div>${VIS.map(([k,l],i)=>{const x=st.secs[gi(k)];return html`${k===BILLING_KEYS[0]&&i>0&&html`<span class="tab-sep" aria-hidden="true"/>`}<button data-k=${k} class=${(active===k?'on':'')+(BILLING_KEYS.includes(k)?' bill':'')} aria-current=${active===k?'true':undefined} onKeyDown=${e=>tk(e,i)} onClick=${()=>goTo(k)}><i class=${'dot '+(x.complete?'verified':x.state==='not_started'?'not_started':'saved')}/>${l}<span class="sr">, ${secLabel(x)}</span></button>`;})}</div></nav>
    <div class="secs">${VIS.map(([k,l],i)=>{const g=gi(k),x=st.secs[g],isOpen=!!open[k],B=BODIES[k],done=x.complete;
      const bill=BILLING_KEYS.includes(k),num=bill?BILLING_KEYS.indexOf(k)+1:i+1;
      return html`${i===0&&!bill&&html`<div class="phase"><b>Clinic Onboarding</b><span>${st.secs.filter(x=>!BILLING_KEYS.includes(x.k)&&x.complete).length} of ${SECTIONS.length-BILLING_KEYS.length} complete</span></div>`}
      ${k===BILLING_KEYS[0]&&html`<div class=${'phase bill'+(i===0?' first':'')}><b>Billing Onboarding</b><span>${st.secs.filter(x=>BILLING_KEYS.includes(x.k)&&x.complete).length} of ${BILLING_KEYS.length} complete</span></div>`}
      <section key=${k} id=${'sec-'+k} class=${'sec'+(isOpen?' open':'')+(bill?' bill':'')} style=${`--h1:${SHADES[g][0]};--h2:${SHADES[g][1]}`} aria-labelledby=${'h-'+k}>
        <h2><button id=${'h-'+k} ref=${el=>heads.current[k]=el} aria-expanded=${isOpen} aria-controls=${'p-'+k} onKeyDown=${e=>hk(e,i)} onClick=${()=>setOpen(o=>({...o,[k]:!o[k]}))}>
          <span class=${'step'+(done?' done':'')}>${done?'✓':num}</span><span class="title">${l}</span><${Pill}>${secLabel(x)}</${Pill}><span class=${'chev'+(isOpen?' open':'')}>⌄</span></button></h2>
        <div id=${'p-'+k} role="region" aria-labelledby=${'h-'+k} hidden=${!isOpen} class=${'body'+(flags[k]&&!x.complete?' flagged':'')}>
          ${x.state==='changes'&&x.reason&&html`<div class="note warn"><div><b>Plexus requested changes:</b> ${x.reason}</div></div>`}
          ${x.state==='saved'&&x.reason&&html`<div class="note">${x.reason}</div>`}
          <${B} s=${s} up=${up} P=${{...P,pre:k+':',setEk:v=>setEk(v==null?null:(String(v).includes(':')?v:k+':'+v))}}/>
          <${Footer} k=${k} sec=${x} P=${P} act=${act} flag=${!!flags[k]}/>
        </div></section>`;})}</div>
    ${!plexus&&html`<section class=${'final'+(view==='billing'?' bill':'')}>
      ${vsub?html`<div class="final-done">${Icon('check',20)}<div><b>Submitted for review</b><span>Plexus will reach out if anything needs changes.</span></div></div>`:html`
      <div class="final-h"><div><b>Submit for Review</b><span>${vdone===VIS.length?'Everything is complete.':`${VIS.length-vdone} section${VIS.length-vdone>1?'s':''} left`}</span></div>
        <button class="btn pri big" onClick=${submitAll}>Submit for Review</button></div>
      ${tried&&vdone<VIS.length&&html`<div class="flagmsg" role="status">${Icon('alert',16)}<span>Finish these first:</span></div>
        <div class="chips">${vis.filter(x=>!x.complete).map(x=>html`<button type="button" class="chip warn" onClick=${()=>goTo(x.k)}>${x.label}</button>`)}</div>`}`}
    </section>`}
    <details class="audit"><summary>🕘 Audit history (${s.audit.length})</summary>${s.audit.length?html`<ol>${s.audit.slice(0,200).map(a=>html`<li><b>${a.ev}</b>${a.d?` — ${a.d}`:''}<br/><span class="small muted">${a.who} · ${a.t}</span></li>`)}</ol>`:html`<p class="small muted">No events yet.</p>`}</details>
    <p class="small muted" style="text-align:center;margin-top:18px">Interactive preview · data stays in this browser · no passwords are stored</p>
  </main>`;
}

const emailOk=e=>/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(e);
function InviteBox({fac,team,list,setS}){
  const blankRow=()=>({id:uid(),name:'',email:''});
  const [rows,setRows]=useState(()=>[blankRow()]),[err,setErr]=useState(''),[copied,setCopied]=useState(false);
  const label=team==='clinic'?'Clinic onboarding':'Billing onboarding';
  const now=()=>new Date().toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  const mut=f=>setS(p=>{const n=structuredClone(p);n.invites=n.invites||{};n.invites[fac]=n.invites[fac]||{clinic:[],billing:[]};f(n.invites[fac][team],n);return n;});
  const setRow=(id,k,v)=>{setRows(r=>r.map(x=>x.id===id?{...x,[k]:v}:x));setErr('');};
  const send=()=>{const filled=rows.filter(r=>r.email.trim()||r.name.trim());
    if(!filled.length){setErr('Add at least one person.');return;}
    const bad=filled.filter(r=>!emailOk(r.email.trim()));if(bad.length){setErr('Check the email for: '+bad.map(r=>r.name||r.email||'a blank row').join(', '));return;}
    mut((l,n)=>{for(const r of filled){const e=r.email.trim().toLowerCase(),ex=l.find(x=>x.email===e);if(ex){ex.sent=now();if(r.name.trim())ex.name=r.name.trim();}else l.push({id:uid(),name:r.name.trim(),email:e,sent:now()});}
      n.audit.unshift({t:new Date().toLocaleString(),who:'Morgan Lee (Plexus coordinator)',ev:`${label} invitation sent — ${fac}`,d:filled.map(r=>r.email.trim()).join(', ')});});
    setRows([blankRow()]);setErr('');};
  const link=(()=>{try{return location.origin+location.pathname+'?view='+team;}catch(e){return '?view='+team;}})();
  return html`<div class=${'invbox '+team}><div class="invbox-h"><b>${label}</b><span>${list.length} invited</span></div>
    ${list.length?html`<ul class="invlist">${list.map(x=>html`<li key=${x.id}><span class="inv-e">${x.name?html`<b>${x.name}</b><br/>`:''}<span>${x.email}</span></span><span class="small muted">Sent ${x.sent}</span>
      <button class="link" onClick=${()=>mut(l=>{const y=l.find(z=>z.id===x.id);if(y)y.sent=now();})}>Resend</button><button class="link danger-link" onClick=${()=>mut(l=>{l.splice(l.findIndex(z=>z.id===x.id),1);})}>Remove</button></li>`)}</ul>`:html`<span class="small muted">No one invited yet.</span>`}
    <div class="inv-rows">${rows.map((r,i)=>html`<div class="inv-row" key=${r.id}>
      <input aria-label=${'Name '+(i+1)} placeholder="Full name" value=${r.name} onInput=${e=>setRow(r.id,'name',e.target.value)}/>
      <input aria-label=${'Email '+(i+1)} type="email" placeholder="email@clinic.com" value=${r.email} onInput=${e=>setRow(r.id,'email',e.target.value)} onKeyDown=${e=>{if(e.key==='Enter'){e.preventDefault();send();}}}/>
      ${rows.length>1?html`<button type="button" class="link" aria-label="Remove row" onClick=${()=>setRows(rs=>rs.filter(x=>x.id!==r.id))}>✕</button>`:html`<span/>`}</div>`)}</div>
    <div class="row between"><button type="button" class="btn ghost sm" onClick=${()=>setRows(r=>[...r,blankRow()])}>${Icon('plus',14)} Add another person</button><button class="btn pri sm" onClick=${send}>Send ${rows.filter(r=>r.email.trim()).length>1?rows.filter(r=>r.email.trim()).length+' invitations':'invitation'}</button></div>
    ${err&&html`<span class="small" style="color:var(--red)">${err}</span>`}
    <div class="row small"><span class="muted">Invite link opens ${team==='clinic'?'Clinic':'Billing'} view</span><button class="link" onClick=${()=>{try{navigator.clipboard.writeText(link);setCopied(true);setTimeout(()=>setCopied(false),1500);}catch(e){}}}>${copied?'Copied':'Copy link'}</button></div>
  </div>`;
}
function ReqEditor({s,setS,mode,onClose}){
  // mode: 'defaults' edits s.reqDefaults; 'facility' edits s.reqOverride for this facility
  const [team,setTeam]=useState('clinic');
  const secs=SECTIONS.filter(([k])=>REQ_RULES.some(r=>r[2][team]===k));
  const val=key=>mode==='defaults'?reqDefault(s,team,key):isReq(s,team,key);
  const custom=key=>mode==='facility'&&(((s.reqOverride||{})[team])||{})[key]!==undefined;
  const flip=key=>setS(p=>{const n=structuredClone(p);const tgt=mode==='defaults'?(n.reqDefaults=n.reqDefaults||{}):(n.reqOverride=n.reqOverride||{});tgt[team]=tgt[team]||{};
    const next=!val(key);if(mode==='facility'&&next===reqDefault(n,team,key))delete tgt[team][key];else tgt[team][key]=next;
    n.audit.unshift({t:new Date().toLocaleString(),who:'Morgan Lee (Plexus coordinator)',ev:`${mode==='defaults'?'Default':n.site} requirement changed`,d:`${REQ_RULES.find(r=>r[0]===key)[1]} (${team}) → ${next?'Required':'Optional'}`});return n;});
  const setAll=v=>setS(p=>{const n=structuredClone(p);const tgt=mode==='defaults'?(n.reqDefaults=n.reqDefaults||{}):(n.reqOverride=n.reqOverride||{});tgt[team]={};
    if(mode==='defaults'||v!==undefined)for(const r of REQ_RULES)if(r[2][team]){if(v===undefined)continue;if(mode==='defaults'?v!==true:v!==reqDefault(n,team,r[0]))tgt[team][r[0]]=v;}return n;});
  const nCustom=Object.keys(((s.reqOverride||{})[team])||{}).length;
  return html`<div class="panel reqpanel" id="reqpanel">
    <div class="row between"><div><h3>${mode==='defaults'?'Requirement defaults':'Requirements · '+s.site}</h3>
      <span class="small muted">${mode==='defaults'?'Applies to every facility unless a facility is customized.':nCustom?`${nCustom} customized for this facility · others follow the defaults`:'Following the defaults'}</span></div>
      <button class="link" onClick=${onClose}>Close</button></div>
    <div class="req-tabs" role="tablist">${[['clinic','Clinic onboarding'],['billing','Billing onboarding']].map(([t,l])=>html`<button role="tab" aria-selected=${team===t} class=${'req-tab '+t+(team===t?' on':'')} onClick=${()=>setTeam(t)}>${l}</button>`)}</div>
    <div class="row req-actions"><button class="btn ghost sm" onClick=${()=>setAll(true)}>All required</button><button class="btn ghost sm" onClick=${()=>setAll(false)}>All optional</button>${mode==='facility'&&html`<button class="btn ghost sm" onClick=${()=>setAll(undefined)}>Reset to defaults</button>`}</div>
    <div class="req-grid">${secs.map(([k,label])=>html`<div class="req-sec" key=${k}><b>${label}</b>
      ${REQ_RULES.filter(r=>r[2][team]===k).map(([key,l])=>{const on=val(key);return html`<button type="button" role="switch" aria-checked=${on} class=${'req-row'+(on?' on':'')} onClick=${()=>flip(key)}>
        <span class="req-l">${l}${custom(key)&&html`<i class="req-c">custom</i>`}</span><span class="req-v">${on?'Required':'Optional'}</span><span class=${'sw '+team+(on?' on':'')}><i/></span></button>`;})}</div>`)}</div>
  </div>`;
}
function Console({s,st,setS,openReview}){
  const access=[...s.payers,...s.logins,...s.flows.labs,...s.clinicians.flatMap(c=>c.portals)].filter(a=>a.status!=='verified'&&(a.invite==='sent'||a.invite==='pending'||a.website||a.username||a.login)).length;
  const others=[['Mesa Clinic','Sonoran Family Health',30,'Clinic Completing',7,1,'Jordan Ellis','Dec 8, 2026'],['Lakeside Clinic','Lakeside Medical',80,'Plexus Reviewing',2,3,'Jordan Ellis','Nov 30, 2026']];
  const set=k=>e=>setS(p=>{const n=structuredClone(p);n.settings[k]=e.target.value.trim();return n;});
  const [open,setOpen]=useState(null),[reqOpen,setReqOpen]=useState(false);
  const invs=f=>(s.invites||{})[f]||{clinic:[],billing:[]};
  const invBtn=f=>{const v=invs(f);return html`<button class=${'btn sm'+(open===f?' pri':'')} aria-expanded=${open===f} onClick=${()=>setOpen(open===f?null:f)}>${Icon('user',14)} Invite${v.clinic.length+v.billing.length?` · ${v.clinic.length} / ${v.billing.length}`:''}</button>`;};
  const invPanel=f=>html`<div class="panel invpanel" id="invpanel"><div class="row between"><h3>Invitations · ${f}</h3><button class="link" onClick=${()=>setOpen(null)}>Close</button></div><div class="invgrid">${['clinic','billing'].map(t=>html`<${InviteBox} key=${f+t} fac=${f} team=${t} list=${invs(f)[t]} setS=${setS}/>`)}</div></div>`;
  useEffect(()=>{if(open)document.getElementById('invpanel')?.scrollIntoView({block:'nearest',behavior:'smooth'});},[open]);
  return html`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h1>Clinic onboarding</h1><button class=${'btn'+(reqOpen?' pri':'')} onClick=${()=>setReqOpen(!reqOpen)}>${Icon('check',15)} Requirement defaults</button></div>
  ${reqOpen&&html`<${ReqEditor} s=${s} setS=${setS} mode="defaults" onClose=${()=>setReqOpen(false)}/>`}
  <div class="kpis"><div class="kpi"><b>3</b><span>Assigned clinics</span></div><div class="kpi"><b>${st.review+5}</b><span>Sections awaiting review</span></div><div class="kpi"><b>${access+4}</b><span>Access requests to verify</span></div><div class="kpi"><b>${st.stage===2?1:0}</b><span>Ready to launch</span></div></div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Facility / organization</th><th>Stage</th><th>Clinic team</th><th>Billing team</th><th>Outstanding</th><th>Access to verify</th><th>Coordinator</th><th>Target date</th><th>Launch readiness</th><th></th></tr></thead><tbody>
    <tr><td><b style="font-weight:500">${s.site}</b><div class="small muted">${s.clinic} · ${s.locations.length} location${s.locations.length===1?'':'s'}</div></td><td><${Pill}>${['Clinic Completing','Plexus Reviewing','Ready to Launch'][st.stage]}</${Pill}></td>
      ${[st.secs.filter(x=>!BILLING_KEYS.includes(x.k)),st.secs.filter(x=>BILLING_KEYS.includes(x.k))].map(g=>{const d=g.filter(x=>x.complete).length,sub=g.every(x=>['submitted','na','verified','waived'].includes(x.state));return html`<td><span class="mini"><span style=${`width:${Math.round(d/g.length*100)}%`}/></span>${d}/${g.length}${sub?html`<div class="small muted">Submitted</div>`:''}</td>`;})}<td title=${st.secs.filter(x=>!['verified','waived'].includes(x.state)).map(x=>x.label).join(', ')}>${SECTIONS.length-st.done} sections${st.review?html`<div class="small muted">${st.review} awaiting review</div>`:''}</td><td>${access}</td><td>Morgan Lee</td><td>Dec 15, 2026</td>
      <td>${st.stage===2?html`<${Pill} tone="green">Sections verified</${Pill}>`:html`<${Pill} tone="gray">Not ready</${Pill}>`}</td><td><div class="acts"><button class="btn sm pri" onClick=${openReview}>Open review</button>${invBtn(s.site)}</div></td></tr>
    ${others.map(o=>html`<tr><td><b style="font-weight:500">${o[0]}</b><div class="small muted">${o[1]} · sample row</div></td><td><${Pill}>${o[3]}</${Pill}></td><td><span class="mini"><span style=${`width:${o[2]}%`}/></span>${Math.round(o[2]/100*9)}/9</td><td><span class="mini"><span style=${`width:${o[2]>50?100:25}%`}/></span>${o[2]>50?4:1}/4</td><td>${o[4]} sections</td><td>${o[5]}</td><td>${o[6]}</td><td>${o[7]}</td><td><${Pill} tone="gray">Not ready</${Pill}></td><td><div class="acts">${invBtn(o[0])}</div></td></tr>`)}
  </tbody></table></div></div>
  ${open&&invPanel(open)}`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
