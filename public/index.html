<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plexus Ancillary Services — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--canvas:hsl(208 50% 94%);--line:hsl(207 40% 86%);--ink:hsl(218 55% 15%);--muted:hsl(220 14% 45%);--card:#fff;--soft:hsl(205 50% 95%);--field:hsl(208 34% 80%);
--accent:hsl(212 72% 36%);--accent-soft:hsl(205 85% 95%);--accent-line:hsl(205 60% 82%);--surface:hsla(205,60%,99%,.82);--ice:hsl(198 80% 92%);--frost:hsl(205 70% 97%);
--green:hsl(152 40% 32%);--green-soft:hsl(150 45% 94%);--amber:hsl(36 70% 32%);--amber-soft:hsl(40 85% 93%);--red:hsl(6 55% 42%);--red-soft:hsl(6 70% 96%);--blue:hsl(214 60% 40%);--blue-soft:hsl(214 70% 95%)}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;background:radial-gradient(1200px 500px at 85% -10%,hsla(195,90%,85%,.55),transparent 60%),radial-gradient(900px 500px at -10% 30%,hsla(220,80%,88%,.5),transparent 60%),linear-gradient(180deg,hsl(205 60% 96%),hsl(212 45% 92%));background-attachment:fixed;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid hsl(236 60% 60%);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* app bar */
.bar{position:fixed;inset:0 0 auto;height:56px;z-index:50;background:linear-gradient(90deg,hsl(222 65% 12%),hsl(214 70% 22%) 60%,hsl(200 70% 30%));color:#eef6ff;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #222}
.bar .ctx{flex:1;min-width:0}.bar .ctx small{display:block;font-size:10.5px;letter-spacing:.14em;color:#999;text-transform:uppercase}.bar .ctx strong{font-weight:300;font-size:15px}
.bar select,.bar button{background:hsla(210,60%,90%,.08);border:1px solid hsla(200,80%,85%,.25);color:#eee;border-radius:8px;height:34px;padding:0 10px;font-size:13px}
.bar .views{display:flex;gap:4px;background:hsla(215,60%,8%,.35);border:1px solid hsla(200,80%,85%,.2);border-radius:9px;padding:3px}
.bar .views button{border:0;background:none;height:28px}.bar .views button.on{background:hsl(198 85% 90%);color:hsl(218 60% 18%)}
main{max-width:1180px;margin:0 auto;padding:76px 24px 60px}
/* winter */
.hero::after{content:none}
.sec>h2 button::after{content:none;position:absolute;right:58px;top:50%;transform:translateY(-50%);font-size:34px;color:hsla(0,0%,100%,.09);pointer-events:none}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.snow i{position:absolute;top:-12px;color:hsla(205,80%,70%,.45);font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(30px,105vh,0) rotate(220deg)}}
main{position:relative;z-index:1}
.card{box-shadow:0 1px 2px hsla(210,60%,30%,.05)}
.access-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.access{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent-line)}
.access.admin{background:linear-gradient(180deg,hsl(214 70% 96%),hsl(214 60% 99%))}.access.regular{background:linear-gradient(180deg,hsl(195 75% 95%),hsl(195 60% 99%))}
.access-h b{display:block;font-weight:600;font-size:14px;color:hsl(214 60% 28%)}.access-h span{font-size:12px;color:var(--muted)}
.pw{display:flex;align-items:center;gap:6px}.pw input{flex:1}
@media(max-width:860px){.access-grid{grid-template-columns:1fr}}
/* ---- iOS bento design system ---- */
:root{--warm:#fffdf9;--lav:hsl(250 70% 97%);--lav-2:hsl(250 55% 92%);--lav-ink:hsl(250 38% 46%);--navy:hsl(220 55% 18%);--bluegray:hsl(215 18% 46%);--r-card:18px;--r-ctl:12px}
.grp{display:flex;flex-direction:column;gap:12px}
.grp-h{display:flex;align-items:center;gap:11px}.grp-h h3{margin:0;font-size:17px;font-weight:600;color:var(--navy);letter-spacing:-.01em}.grp-h p{margin:1px 0 0;font-size:12.5px;color:var(--bluegray)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,hsl(208 80% 95%),var(--lav));color:hsl(218 60% 34%);flex-shrink:0;box-shadow:inset 0 0 0 1px hsla(214,60%,60%,.12)}
.ico.sm{width:30px;height:30px;border-radius:9px}
.bento{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}.bento.c1{grid-template-columns:1fr}.bento.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;min-height:132px;padding:16px 16px 14px;background:var(--warm);border:1px solid hsl(210 30% 90%);border-radius:var(--r-card);box-shadow:0 1px 2px hsla(215,40%,30%,.04),0 8px 24px -12px hsla(215,50%,35%,.14);cursor:pointer;text-align:left;transition:transform .18s ease,box-shadow .18s ease,border-color .18s;min-width:0}
.tile:hover{transform:translateY(-1px);border-color:hsl(212 55% 82%);box-shadow:0 1px 2px hsla(215,40%,30%,.05),0 14px 30px -14px hsla(215,60%,35%,.24)}
.tile:focus-visible{outline:2px solid hsl(212 70% 55%);outline-offset:2px}
.tile.span{grid-column:1/-1}
.tile-top{display:flex;align-items:center;gap:10px}.tile-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile-title b{font-size:16px;font-weight:600;color:var(--navy);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11.5px;font-weight:500;color:var(--lav-ink);background:var(--lav);border:1px solid var(--lav-2);padding:1px 8px;border-radius:99px;white-space:nowrap}
.chev-r{color:hsl(215 20% 62%);display:inline-flex;transition:transform .18s}.tile:hover .chev-r{transform:translateX(2px);color:hsl(214 55% 45%)}
.tile-lines{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:hsl(218 30% 26%);min-width:0}.tile-lines span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-lines span+span{color:var(--bluegray);font-size:13px}
.tile-status{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--bluegray)}
.tile-status.ok{color:var(--green)}.tile-status.warn{color:hsl(32 70% 36%)}.tile-status.info{color:hsl(214 60% 40%)}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.tile.editing{grid-column:1/-1;cursor:default;min-height:0;padding:0;gap:0;background:linear-gradient(180deg,hsla(0,0%,100%,.96),hsla(205,70%,98%,.94));backdrop-filter:blur(10px);border-color:hsl(212 55% 82%);box-shadow:0 1px 2px hsla(215,40%,30%,.05),0 20px 40px -20px hsla(215,60%,35%,.3)}
.tile.editing:hover{transform:none}
.ed-h{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid hsl(210 30% 91%)}.ed-t{flex:1;display:flex;flex-direction:column}.ed-t b{font-size:16px;font-weight:600;color:var(--navy)}.ed-t span{font-size:12px;color:var(--bluegray)}
.ed-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.eg{border:1px solid hsl(210 30% 91%);border-radius:14px;background:hsla(0,0%,100%,.7)}
.eg>summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px}
.eg>summary::-webkit-details-marker{display:none}
.eg>summary::before{content:'';width:7px;height:7px;border-right:1.6px solid hsl(215 20% 55%);border-bottom:1.6px solid hsl(215 20% 55%);transform:rotate(-45deg);transition:transform .18s;margin-right:2px}
.eg[open]>summary::before{transform:rotate(45deg)}
.eg>.grid,.eg>.stack{padding:2px 14px 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.addtile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:132px;padding:16px;border-radius:var(--r-card);border:1.5px dashed hsl(245 40% 82%);background:linear-gradient(160deg,#fff,var(--lav));color:var(--lav-ink);cursor:pointer;text-align:center;transition:border-color .18s,background .18s,transform .18s}
.addtile:hover:not(:disabled){border-color:hsl(245 50% 66%);background:linear-gradient(160deg,#fff,var(--lav-2));transform:translateY(-1px)}
.addtile:focus-visible{outline:2px solid hsl(245 60% 60%);outline-offset:2px}.addtile:disabled{opacity:.5;cursor:not-allowed}
.addtile .plus{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--lav-2),0 6px 14px -8px hsla(250,50%,45%,.5);color:var(--lav-ink)}
.addtile b{font-size:14.5px;font-weight:600;color:var(--navy)}.addtile .hint{font-size:12.5px;color:var(--bluegray)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:132px;border-radius:var(--r-card);border:1px dashed hsl(210 30% 84%);color:var(--bluegray);font-size:13.5px;text-align:center;padding:16px;background:hsla(0,0%,100%,.5)}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:hsl(210 30% 96%);color:var(--bluegray)}.search input{border:0;background:transparent;box-shadow:none!important;padding:9px 0}
.ioslist{list-style:none;margin:0;padding:0;border-radius:14px;background:#fff;border:1px solid hsl(210 30% 91%);overflow:hidden}
.ioslist li+li{border-top:1px solid hsl(210 30% 93%)}
.iosrow{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:14px;cursor:pointer}.iosrow input{position:absolute;opacity:0;width:1px;height:1px}
.iosrow:hover{background:hsl(208 60% 97%)}.iosrow span{flex:1}.iosrow .tick{display:inline-flex;color:hsl(214 70% 42%);font-style:normal;width:16px}
.iosrow:focus-within{box-shadow:inset 0 0 0 2px hsl(212 70% 60%)}.iosrow.on{color:var(--navy);font-weight:500}
.plist{background:hsla(0,0%,100%,.75);backdrop-filter:blur(8px);border-radius:18px}
.sec.open .body{background:linear-gradient(180deg,hsla(205,70%,98%,.6),transparent 240px)}
@media(max-width:860px){.bento,.bento.c3{grid-template-columns:1fr}.tile,.addtile{min-height:112px}}
@media(prefers-reduced-motion:reduce){.tile,.addtile,.chev-r{transition:none}.tile:hover,.addtile:hover{transform:none}}

/* ---- typography & density refinement ---- */
/* Settings page */
main.sp-wrap{max-width:1120px}
.sp{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start;padding-top:8px}
.sp>*{min-width:0}.sp-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:6px}.sp-nav h2{margin:6px 0 10px 12px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.sp-back{all:unset;cursor:pointer;font-size:14px;color:var(--bluegray);padding:4px 12px}.sp-back:hover{color:var(--navy)}
.sp-nav nav{display:flex;flex-direction:column;gap:2px}
.sp-nav-i{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500;color:hsl(218 25% 32%)}
.sp-nav-i:hover{background:hsla(214,60%,50%,.07)}.sp-nav-i.on{background:#fff;color:hsl(222 60% 18%);box-shadow:0 1px 2px hsla(215,40%,30%,.08),0 0 0 1px hsl(214 30% 90%)}.sp-nav-i.on svg{color:hsl(214 64% 45%)}.sp-nav-i:focus-visible{outline:2px solid hsl(210 90% 60%)}
.sp-h{margin-bottom:18px}.sp-h h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.015em}.sp-h p{margin:6px 0 0;font-size:15px;color:var(--bluegray)}
.sp-stack,.sp-req{display:flex;flex-direction:column;gap:16px}
.sp-card{background:#fff;border:1px solid hsl(214 30% 90%);border-radius:16px;padding:6px 20px;box-shadow:0 1px 2px hsla(215,40%,30%,.04)}.sp-card.dim{opacity:.55;pointer-events:none}
.sp-card h4{margin:14px 0 4px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--bluegray)}
.sp-card-h{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px}.sp-card-h h4{margin:0}.count{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:hsl(214 40% 40%);background:hsl(214 60% 95%);border-radius:999px;padding:1px 8px;letter-spacing:0}
.sp-row{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 0;border-top:1px solid hsl(214 30% 94%)}.sp-card h4+.sp-row,.sp-card-h+.sp-row,.sp-card>.sp-row:first-child{border-top:0}
.sp-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15.5px;color:hsl(218 35% 18%)}.sp-l b{font-weight:500}.sp-l small{font-size:13.5px;color:var(--bluegray);overflow:hidden;text-overflow:ellipsis}
.sp-ctl{display:flex;align-items:center;gap:8px;flex-shrink:0}.sp-ctl select,.sp-ctl input{min-height:38px!important;height:38px;font-size:14.5px!important;padding:0 10px!important;border-radius:10px!important;width:auto}.sp-ctl input{width:260px}
.sp-toggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;min-height:52px;border-top:1px solid hsl(214 30% 94%)}.sp-card h4+.sp-toggle{border-top:0}.sp-toggle:focus-visible{outline:2px solid hsl(210 90% 60%);border-radius:8px}
.sp-v{font-size:13px;color:var(--bluegray);min-width:64px;text-align:right}.sp-v.on{color:hsl(222 60% 22%);font-weight:600}
.sp-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.sp-acts{display:flex;gap:16px}
.seg{display:inline-flex;background:hsl(214 30% 92%);border-radius:12px;padding:3px}.seg-b{all:unset;cursor:pointer;padding:8px 16px;border-radius:9px;font-size:14.5px;font-weight:500;color:hsl(218 25% 35%)}.seg-b.on{background:#fff;color:hsl(222 60% 18%);box-shadow:0 1px 3px hsla(215,40%,30%,.15)}.seg-b.billing.on{color:hsl(270 52% 38%)}
.av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:hsl(214 60% 30%);background:hsl(214 70% 93%)}.av.b{border-radius:10px}
.sp-row.user.off .sp-l,.sp-row.user.off .av{opacity:.5}.tag{font-style:normal;font-size:11px;font-weight:600;color:hsl(214 50% 35%);background:hsl(214 60% 94%);border-radius:6px;padding:1px 6px;margin-left:6px}.tag.gray{color:hsl(214 10% 40%);background:hsl(214 10% 92%)}
.icon-b{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:18px;color:var(--bluegray)}.icon-b:hover{background:hsl(214 40% 95%)}.icon-b.ghost{cursor:default}.icon-b.ghost:hover{background:none}
.menu-w{position:relative}.menu{position:absolute;right:0;top:36px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px hsla(215,40%,25%,.15);padding:4px;display:flex;flex-direction:column;min-width:130px}
.menu button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;font-size:14px}.menu button:hover{background:hsl(214 40% 96%)}.menu button.danger{color:var(--red)}
.sp-add{display:grid;grid-template-columns:1.4fr 1fr auto auto auto;gap:8px;align-items:center;padding:6px 0 12px}.sp-add input,.sp-add select{min-height:38px!important;height:38px;font-size:14.5px!important}
.sp-form{padding:6px 0 14px;display:flex;flex-direction:column;gap:10px}.sp-form-a{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.sp-err{color:var(--red);font-size:13.5px;padding-bottom:8px}.sp-foot{margin:0;font-size:13.5px;color:var(--bluegray);padding:0 4px}
.sp-perm summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.sp-perm summary::after{content:'▾';color:var(--bluegray)}.sp-perm[open] summary::after{content:'▴'}.sp-perm summary h4{margin:14px 0}
.sp-perm table{width:100%;margin-bottom:12px}.sp-perm th{font-size:12.5px}.sp-perm td{font-size:14.5px}.sp-perm .ok{color:hsl(155 55% 32%);font-weight:700}.sp-perm .no{color:hsl(214 15% 78%)}
@media(max-width:820px){.sp{grid-template-columns:minmax(0,1fr);gap:16px}.sp-row.user .sp-l small{max-width:150px}.sp-nav{position:static}.sp-nav h2{display:none}.sp-nav nav{flex-direction:row;overflow-x:auto}.sp-nav-i{white-space:nowrap}.sp-add{grid-template-columns:1fr}.sp-ctl input{width:180px}.sp-row{flex-wrap:wrap}}
.set-body .setpanel>.row.between>.link,.set-body .reqpanel>.row.between>.link{display:none}.set-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}.set-body{min-width:0}
.set-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px}
.set-nav-i{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500;color:hsl(218 30% 26%)}
.set-nav-i:hover{background:hsl(214 60% 96%)}.set-nav-i.on{background:hsl(222 60% 18%);color:#fff}.set-nav-i:focus-visible{outline:2px solid hsl(210 90% 60%)}
@media(max-width:760px){.set-layout{grid-template-columns:1fr}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-nav-i{white-space:nowrap}}
.set-btn{display:inline-flex;align-items:center;gap:6px;height:36px!important;padding:0 12px!important;border-radius:999px!important}.set-btn.on{border-color:#c4dbff!important;color:#c4dbff!important}
.settings{scroll-margin-top:130px;margin:0 0 18px;display:flex;flex-direction:column;gap:12px}.set-head{display:flex;justify-content:space-between;align-items:center}.set-head h2{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.set-tabs{display:flex;gap:6px;flex-wrap:wrap}.set-tab{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500}.set-tab.on{background:var(--navy,hsl(222 60% 18%));border-color:transparent;color:#fff}.set-tab:focus-visible{outline:2px solid hsl(210 90% 60%)}
.settings .setpanel,.settings .reqpanel,.settings .addfac{margin:0}.faclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}.faclist li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid hsl(210 30% 94%);font-size:15px;flex-wrap:wrap}
@media(max-width:640px){.set-btn span{display:none}.set-btn{padding:0 10px!important}.bar{height:auto!important;flex-wrap:wrap;padding:8px 10px!important;row-gap:8px}.bar .views{order:5;width:100%;margin:0!important;justify-content:space-between}.bar .views button{flex:1}.bar .who{margin-left:auto}main{padding-top:118px!important}}
.by-tag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:500;color:hsl(214 40% 40%);background:hsl(214 60% 96%);border:1px solid hsl(214 50% 88%);border-radius:999px;padding:2px 8px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-top+.tile-lines+.by-tag,.tile-top+.by-tag{margin-left:42px}.ed-t .by-tag{margin-top:4px}
@media(max-width:640px){.tile-top+.tile-lines+.by-tag{margin-left:0}}
.modal-bg{position:fixed;inset:0;z-index:200;background:hsla(220,40%,10%,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(640px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4)}.modal h3{margin:0;font-size:19px}
.peer-list{display:flex;flex-direction:column;gap:10px}.peer{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.peer-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.peer-h .by-tag{margin:0}.peer-v{display:flex;flex-direction:column;gap:2px;font-size:14.5px}.peer-v .lbl{font-size:12px;color:var(--bluegray)}.peer-v.ours{color:hsl(32 60% 30%)}

    return html`<button type="button" class=${'chip'+(ok?' on':'')} disabled=${dis} aria-pressed=${multi?ok:undefined} role=${multi?undefined:'radio'} aria-checked=${multi?undefined:ok}
    onClick=${()=>on(multi?(ok?sel.filter(x=>x!==v):[...sel,v]):(ok?'':v))}>${ok?'✓ ':''}${l}</button>`;})}</div></div>`;}
function Check({label,checked,on,dis}){return html`<label class="check"><input type="checkbox" checked=${!!checked} disabled=${dis} onChange=${e=>on(e.target.checked)}/><span>${label}</span></label>`;}
function Pill({children,tone}){const t=String(children);const a=tone||(/verified|match|compatible|ready to launch/i.test(t)?'green':/review|pending|sent|progress|reported|entered/i.test(t)?'amber':/changes|required|action|config|not configured/i.test(t)?'red':/applicable/i.test(t)?'blue':'gray');return html`<span class=${'pill '+a}>${children}</span>`;}
function Card({title,sub,meta,children,wide,isNew}){return html`<article class=${'card'+(wide?' wide':'')+(isNew?' new':'')}><header><div><h4>${title}</h4>${sub&&html`<p>${sub}</p>`}</div>${meta&&html`<div class="meta">${meta}</div>`}</header><div class="cb">${children}</div></article>`;}
function Remove({label,onRemove,dis}){const [ask,setAsk]=useState(false);if(dis)return null;
  return ask?html`<div class="confirm" role="alertdialog">Remove ${label}?<button class="btn danger sm" onClick=${onRemove}>Remove</button><button class="btn ghost sm" onClick=${()=>setAsk(false)}>Cancel</button></div>`:html`<button class="x" title=${'Remove '+label} aria-label=${'Remove '+label} onClick=${()=>setAsk(true)}>×</button>`;}
function Copy({text,label='Copy'}){const [d,setD]=useState(false);return html`<button class="btn ghost sm" disabled=${!text} onClick=${async()=>{try{await navigator.clipboard.writeText(text);setD(true);setTimeout(()=>setD(false),1500);}catch(e){}}}>${d?'Copied':label}</button>`;}

/* ---------------- shared access pieces ---------------- */
function Secret(){return html`<div class="secret cfg"><div class="row"><${Pill} tone="red">Config Required</${Pill}><span class="small">Secure password submission needs Plexus’s approved credential vault.</span></div><span class="small muted">This preview never stores passwords. Use the invitation option or a named delegated account until the vault is connected.</span></div>`;}
function Invitation({rec,item,patch,P,label='invitation'}){
  const [open,setOpen]=useState(false),[note,setNote]=useState(''),[ok,setOk]=useState(false),[vn,setVn]=useState('');
  const states=[['not_sent','Not Sent'],['sent','Sent'],['pending','Pending Acceptance'],['verified','Verified']];
  return html`<div class="invite">
    <div class="row small">Send the ${label} to ${rec?html`<code>${rec}</code><${Copy} text=${rec} label="Copy address"/>`:html`<${Pill} tone="red">Plexus has not configured this recipient yet</${Pill}>`}</div>
    <span class="small muted">In the portal’s user-management area, invite the address above with the least access needed. Do not share your own password.</span>
    <div class="row small"><span class="muted">Invitation:</span>${states.map(([v,l])=>html`<${Pill} tone=${item.invite===v?undefined:'gray'}>${l}${item.invite===v?' ✓':''}</${Pill}>`)}</div>
    ${item.inviteNote&&item.invite!=='not_sent'&&html`<span class="small muted">Clinic confirmed: “${item.inviteNote}” · ${item.inviteAt}</span>`}
    ${P.edit&&item.invite==='not_sent'&&(!open?html`<button class="btn sm" style="width:fit-content" onClick=${()=>setOpen(true)}>I sent the invitation</button>`:html`<div class="inline"><${Field} label="How and when did you send it?" value=${note} on=${setNote} ph="e.g. Added through the payer portal user page on Nov 16"/><${Check} label="I confirm the invitation was actually submitted." checked=${ok} on=${setOk}/><div class="row"><button class="btn pri sm" disabled=${!ok||!note.trim()} onClick=${()=>{patch(i=>{i.invite='sent';i.inviteNote=note;i.inviteAt=new Date().toLocaleString();},`Invitation confirmed sent: ${note}`);setOpen(false);}}>Record as sent</button><button class="btn ghost sm" onClick=${()=>setOpen(false)}>Cancel</button></div></div>`)}
    ${P.edit&&item.invite==='sent'&&html`<button class="link" style="width:fit-content" onClick=${()=>patch(i=>{i.invite='not_sent';i.inviteNote='';},'Invitation marked not sent')}>Undo — not sent yet</button>`}
    ${P.plexus&&['sent','pending'].includes(item.invite)&&html`<div class="inline"><${Field} label="Plexus verification note" value=${vn} on=${setVn}/><div class="row">${item.invite==='sent'&&html`<button class="btn sm" disabled=${!vn.trim()} onClick=${()=>{patch(i=>{i.invite='pending';},'Invitation pending acceptance: '+vn,true);setVn('');}}>Mark pending acceptance</button>`}<button class="btn pri sm" disabled=${!vn.trim()} onClick=${()=>{patch(i=>{i.invite='verified';i.status='verified';i.verifiedAt=new Date().toLocaleString();},'Access verified: '+vn,true);setVn('');}}>Verify access</button></div></div>`}
  </div>`;}
function Verify({item,patch,P}){const [n,setN]=useState('');
  return html`<div class="row between small" style="border-top:1px dashed var(--line);padding-top:8px"><span>${item.status==='verified'?html`<${Pill}>Verified</${Pill}> <span class="muted">${item.verifiedAt} by Plexus</span>`:html`<${Pill} tone="gray">Access not verified</${Pill}> <span class="muted">A typed website or username is never treated as verified access.</span>`}</span>
  ${P.plexus&&item.status!=='verified'&&html`<div class="row"><input style="width:220px;min-height:32px" placeholder="Verification note" value=${n} onInput=${e=>setN(e.target.value)}/><button class="btn pri sm" disabled=${!n.trim()} onClick=${()=>{patch(i=>{i.status='verified';i.verifiedAt=new Date().toLocaleString();},'Access verified: '+n,true);setN('');}}>Record verified access</button></div>`}</div>`;}

function Icon(n,size=18){return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(ICONS[n]||[]).map(d=>html`<path d=${d}/>`)}</svg>`;}
const fmtTime=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM',hh=h%12||12;return m?`${hh}:${String(m).padStart(2,'0')} ${ap}`:`${hh} ${ap}`;};
function fmtDays(days=[]){if(!days.length)return '';const idx=days.map(d=>DAYS.indexOf(d)).sort((a,b)=>a-b);const runs=[];let st=idx[0],pv=idx[0];
  for(const i of idx.slice(1)){if(i===pv+1){pv=i;continue;}runs.push([st,pv]);st=pv=i;}runs.push([st,pv]);
  return runs.map(([a,b])=>b-a>=2?`${DAYS[a]}–${DAYS[b]}`:a===b?DAYS[a]:`${DAYS[a]}, ${DAYS[b]}`).join(', ');}
const hoursLine=(days,a,b)=>[fmtDays(days),a&&b?`${fmtTime(a)}–${fmtTime(b)}`:''].filter(Boolean).join(' · ');
function Group({icon,title,sub,cols=2,children}){return html`<section class="grp"><div class="grp-h"><span class="ico">${Icon(icon)}</span><div><h3>${title}</h3>${sub&&html`<p>${sub}</p>`}</div></div><div class=${'bento c'+cols}>${children}</div></section>`;}
function AddTile({label,onClick,dis,needed}){return html`<button type="button" class=${'addtile'+(needed?' need':'')} disabled=${dis} onClick=${onClick}><span class="plus">${Icon('plus',20)}</span><b>${label}</b></button>`;}
function Flat({title,children}){return html`<div class="flat"><span class="flat-h">${title}</span><div class="grid">${children}</div></div>`;}
function EGroup({title,open=true,children}){return html`<details class="eg" open=${open}><summary>${title}</summary><div class="grid">${children}</div></details>`;}
/** Summary-first card. Tap to edit inline; Done returns to the updated summary. */
function Tile({id,P,icon,title,req,badge,lines=[],empty,done,tone,missing=[],editor,onDone,span,foot,cls='',by}){
  const tid=(P.pre||'')+id,open=P.ek===tid,ref=useRef(null);
  if(done===undefined)done=tone==='ok'?true:tone==='warn'?false:null;
  const shown=lines.filter(Boolean).slice(0,2);
  useEffect(()=>{if(!open||!ref.current)return;ref.current.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});const f=ref.current.querySelector('.ed-b input,.ed-b select,.ed-b textarea,.ed-b button');f&&f.focus({preventScroll:true});},[open]);
  const close=()=>{onDone&&onDone();P.setEk(null);requestAnimationFrame(()=>document.getElementById('tile-'+tid)?.focus());};
  if(open)return html`<div ref=${ref} class=${'tile editing'+(cls?' '+cls:'')} role="group" aria-label=${'Editing '+title} onKeyDown=${e=>{if(e.key==='Escape'){e.stopPropagation();close();}}}>
    <div class="ed-h">${icon&&html`<span class="ico">${Icon(icon)}</span>`}<div class="ed-t"><b>${title}</b>${missing.length>0&&html`<span class="ed-miss">Still needed: ${missing.join(', ')}</span>`}${by&&html`<${ByTag} by=${by}/>`}</div>${foot}<button type="button" class="btn pri" onClick=${close}>${Icon('check',16)} Done</button></div>
    <div class="ed-b">${editor()}</div></div>`;
  return html`<button type="button" id=${'tile-'+tid} class=${'tile'+(span?' span':'')+(done===false?' incomplete':'')+(cls?' '+cls:'')} onClick=${()=>P.setEk(id)}>
    <span class="tile-top">${icon&&html`<span class="ico sm">${Icon(icon,17)}</span>`}<span class="tile-title"><b>${title}${req&&html`<span class="req" aria-label="required"> *</span>`}</b>${badge&&html`<span class="badge">${badge}</span>`}</span>
      ${done===true?html`<span class="ind ok" title="Complete" aria-label="Complete">${Icon('check',14)}</span>`:done===false?html`<span class="ind dot" title="Incomplete" aria-label="Incomplete"/>`:null}<span class="chev-r">${Icon('chev',18)}</span></span>
    ${shown.length?html`<span class="tile-lines">${shown.map(l=>html`<span>${l}</span>`)}</span>`:empty&&html`<span class="tile-lines"><span class="ph">${empty}</span></span>`}
    ${by&&html`<${ByTag} by=${by}/>`}
  </button>`;}
const need=(n)=>({done:!n});

          <${Field} label="Group taxonomy code" ph="e.g. 207Q00000X" value=${o.taxonomy} on=${v=>setO('taxonomy')(v.toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,10))} err=${o.taxonomy&&o.taxonomy.length!==10?'Taxonomy codes have 10 characters':''} dis=${!P.edit}/>
          <${Sel} label="Practice type" value=${o.type} on=${setO('type')} opts=${['Primary care','Internal medicine','Family medicine','Cardiology','Neurology','Multispecialty','Skilled nursing','Other']} dis=${!P.edit}/>
          <${Chips} label="Clinic status" multi=${false} opts=${['Running','Preparing to Open','Temporarily Closed']} value=${o.status} on=${setO('status')} dis=${!P.edit}/>
        </${EGroup}>
        ${!bill&&html`<${EGroup} title="Contact">
          <${Field} label="Main clinic telephone" req type="tel" value=${o.phone} on=${setO('phone')} dis=${!P.edit}/>
          <${Field} label="Main fax" type="tel" value=${o.fax} on=${setO('fax')} dis=${!P.edit}/>

          <${Field} label="Website" type="url" ph="https://" value=${o.website} on=${setO('website')} dis=${!P.edit}/>

  </${Group}>
  <${Group} icon="pin" title="Locations">
    ${s.locations.map(l=>{const miss=bill?[l.name,l.street,l.city,l.state,l.zip].filter(blank).length:[l.name,l.street,l.city,l.state,l.zip,l.tz].filter(blank).length+(!l.days.length||!l.open||!l.close?1:0);
      return html`<${Tile} key=${l.id} id=${'loc-'+l.id} P=${P} by=${l._by} icon="pin" title=${l.name||'New location'} badge=${l.primary?'Primary':''}
        lines=${l.street||l.city?[[[l.street,l.suite].filter(Boolean).join(' '),[l.city,[l.state,l.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ')].filter(Boolean).join(', '),hoursLine(l.days,l.open,l.close)]:[]} empty="Add address" ...${need(miss)} missing=${[['name','Location name'],['street','Street address'],['city','City'],['state','State'],['zip','ZIP'],['tz','Timezone']].filter(([k])=>blank(l[k])&&!(bill&&k==='tz')).map(x=>x[1]).concat(!bill&&(!l.days.length||!l.open||!l.close)?['Operating hours']:[])} onDone=${()=>doneLoc(l.id)}
        foot=${html`<${Remove} label=${l.name||'this location'} dis=${!P.edit} onRemove=${()=>{P.setEk(null);up(d=>{d.locations=d.locations.filter(x=>x.id!==l.id);d.clinicians.forEach(c=>c.locs=c.locs.filter(x=>x!==l.id));d.team.forEach(c=>c.locs=c.locs.filter(x=>x!==l.id));if(d.room.loc===l.id)d.room.loc='';if(l.primary&&d.locations[0])d.locations[0].primary=true;},'facility');}}/>`}

      const done=qs.filter(([g,k])=>!blank(f[g][k]?.choice)).length+dk.filter(k=>k!=='example'&&k!=='routine'&&k!=='backupId'&&!blank(f.delivery[k])).length;

        editor=${()=>html`${qs.map(([g,k])=>Q(g,k))}${dk.length>0&&html`<div class="grid">${dk.filter(k=>k!=='example').map(D)}</div>`}
          ${dk.includes('example')&&html`<${Field} full type="textarea" label="Example workflow (optional)" ph="Describe a typical imaging result from arrival to sign-off." value=${f.example} on=${v=>up(d=>{d.flows.example=v;},'flows')} dis=${!P.edit}/>
            ${P.edit&&!f.example&&html`<button class="link" onClick=${()=>up(d=>{d.flows.example='Imaging results arrive by fax, are scanned into the chart by the front desk, and are routed as a task to the ordering provider. The provider reviews and signs within 2 business days. Abnormal findings are called to the patient by the nurse the same day. Results not signed after 3 days are escalated to the office manager.';},'flows')}>Start from an example</button>`}`}`}/>`;})}

          <div class="grid"><${Field} label="Portal website" type="url" value=${l.website} on=${v=>L(x=>{x.website=v;})} dis=${!P.edit}/><${Field} label="Account username" value=${l.username} on=${v=>L(x=>{x.username=v;})} dis=${!P.edit}/>

async function pwHash(email,pw){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('plexus-onboarding:'+email+':'+pw));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(const ch of email+pw)h=(h*31+ch.charCodeAt(0))|0;return 'x'+h;}}

/* Team reminders: when the next one is due for a facility team (null = none due) */
function reminderPlan(fs,team,rem){const ov=(fs.remOverride||{});const on=ov.enabled!==undefined?ov.enabled:rem.enabled;const every=ov.every||rem.every;
  const inv=((fs.invites||{})[fs.site]||{})[team]||[];if(!on)return {state:'off'};if(!inv.length)return {state:'none',label:'No one invited'};
  if(rem.teams!=='both'&&rem.teams!==team)return {state:'off'};
  const keys=SECTIONS.map(x=>x[0]).filter(k=>team==='billing'?BILLING_KEYS.includes(k):!BILLING_KEYS.includes(k));const st=status(fs);const xs=st.secs.filter(x=>keys.includes(x.k));
  if(rem.stopOnSubmit&&xs.every(x=>['submitted','na','verified','waived'].includes(x.state)))return {state:'done',label:'Submitted'};
  if(xs.every(x=>x.complete))return {state:'done',label:'Complete'};
  const log=(fs.reminders||[]).filter(r=>r.team===team);if(log.length>=rem.max)return {state:'max',label:`Max ${rem.max} sent`};
  const last=log.length?log[0].at:(inv.map(x=>x.sentAt).filter(Boolean).sort()[0]||new Date().toISOString());
  const next=addBusinessDays(new Date(last),every,rem.business);return {state:'due',next,overdue:next<=new Date(),count:log.length,to:inv.map(x=>x.email)};}

const SHARED=[['logins','Login'],['payers','Portal'],['clinicians','Clinician'],['locations','Location']];
const strip=o=>{if(!o||typeof o!=='object')return o;const r={};for(const k of Object.keys(o))if(k[0]!=='_')r[k]=o[k];return r;};
function itemSummary(coll,x){if(!x)return '';
  if(coll==='logins'){const a=[['Admin',x.access.admin],['Regular',x.access.regular]].filter(([,v])=>v.on!==false).map(([l,v])=>`${l}: ${v.pathway==='fill'?(v.username||'—')+(v.url?' @ '+v.url.replace(/^https?:\/\//,''):''):v.pathway==='will_send'?'invite pending':v.pathway==='sent'?'invite sent':'not chosen'}`);return `${x.name||x.type} — ${a.join(' · ')||'no access'}`;}
  if(coll==='payers')return `${portalTitle(x)} — ${x.invited?'Invite sent':x.username?`${x.username}${x.website?' @ '+x.website.replace(/^https?:\/\//,''):''}`:'no login yet'}`;
  if(coll==='clinicians')return [x.name||'Unnamed',[...(x.creds||[])].join(', '),x.npi&&'NPI '+x.npi].filter(Boolean).join(' · ');
  if(coll==='locations')return [x.name,[x.street,x.city,x.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
  if(coll==='org')return [x.legalName||x.dba||'Practice',x.status].filter(Boolean).join(' · ');return '';}
function stampChanges(prev,n,by){
  for(const [coll] of SHARED){const before=new Map((prev[coll]||[]).map(x=>[x.id,x]));
    for(const x of n[coll]||[]){const b=before.get(x.id);if(b&&JSON.stringify(strip(b))===JSON.stringify(strip(x)))continue;
      if(x._by&&x._by.tk!==by.tk&&b)x._prev={by:x._by,sum:itemSummary(coll,b)};else if(x._by&&x._by.tk===by.tk&&x._prev&&x._prev.by.tk===by.tk)delete x._prev;x._by=by;}}
  if(JSON.stringify(strip(prev.org))!==JSON.stringify(strip(n.org))){if(n.org._by&&n.org._by.tk!==by.tk)n.org._prev={by:n.org._by,sum:itemSummary('org',prev.org)};n.org._by=by;}}
const latestBy=xs=>xs.map(x=>x._by).filter(Boolean).sort((a,b)=>a.at<b.at?1:-1)[0];

const STARS=Array.from({length:48},(_,i)=>({left:`${((i*37.31+7)%100).toFixed(2)}%`,top:`${((i*61.73+13)%90+5).toFixed(2)}%`,opacity:.2+(i%5)*.08,width:i%7===0?1.5:1,height:i%7===0?1.5:1}));
function BannerStars({intervalMs=30000,fixed}){
  const [m,setM]=useState(null);
  useEffect(()=>{let rm;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}if(rm)return;let prev=-1,id=0;
    const t=setInterval(()=>{const zone=(prev+1+Math.floor(Math.random()*3))%4;prev=zone;setM({id:++id,left:`${4+zone*20+Math.random()*12}%`,top:`${12+Math.random()*34}%`});},intervalMs);return()=>clearInterval(t);},[intervalMs]);
  return html`<div class=${'ws-stars'+(fixed?' fixed':'')} aria-hidden="true">${STARS.map((st,i)=>html`<span key=${i} class="ws-star" style=${{left:st.left,top:st.top,opacity:st.opacity,width:st.width+'px',height:st.height+'px'}}/>`)}
    ${m&&html`<span key=${'m'+m.id} class="ws-meteor" style=${{left:m.left,top:m.top}} onAnimationEnd=${()=>setM(null)}/>`}</div>`;
}

        ${PERMS.map(([k,l,rs])=>html`<tr key=${k}><td>${l}</td>${Object.keys(PROLES).map(r=>html`<td>${rs.includes(r)?html`<span class="ok">✓</span>`:html`<span class="no">—</span>`}</td>`)}</tr>`)}</tbody></table></div></details>
    <p class="sp-foot">Clinic and billing team members aren’t listed here — they’re invited per clinic from the console and create their own accounts.</p>
  </div>`;
}
function SettingsPage({auth,who,s,setS,facs,addFacility,openClinic,tab,setTab,onBack}){
  const tabs=SET_TABS.filter(([k,,perm])=>can(auth,perm));const cur=tabs.find(t=>t[0]===tab)||tabs[0];
  const [rem,setRemS]=useState(loadRem);const setRem=v=>{setRemS(v);jset(REM_KEY,v);};
  const [nf,setNf]=useState({site:'',clinic:'',coordinator:'',target:''}),[err,setErr]=useState(''),[adding,setAdding]=useState(false);
  const save=()=>{if(!nf.site.trim()){setErr('Enter the clinic name.');return;}if(facs.some(f=>f.site.toLowerCase()===nf.site.trim().toLowerCase())){setErr('A clinic with that name already exists.');return;}
    const id=addFacility({site:nf.site.trim(),clinic:nf.clinic.trim(),coordinator:nf.coordinator.trim(),target:nf.target});setNf({site:'',clinic:'',coordinator:'',target:''});setErr('');setAdding(false);openClinic(id);};
  const DESC={clinics:'Add clinics and see everyone you’re onboarding.',req:'Choose what each team must complete. Clinics can be customized in review.',rem:'Automatic email reminders for unfinished onboarding.',users:'Google accounts that can sign in to the Plexus workspace.'};
  return html`<div class="sp">
    <aside class="sp-nav"><button class="sp-back" onClick=${onBack}>← Console</button><h2>Settings</h2>
      <nav aria-label="Settings">${tabs.map(([k,l,,ic])=>html`<button aria-current=${cur[0]===k?'page':undefined} class=${'sp-nav-i'+(cur[0]===k?' on':'')} onClick=${()=>setTab(k)}>${Icon(ic,16)}<span>${l}</span></button>`)}</nav></aside>
    <section class="sp-main"><header class="sp-h"><h1>${cur[1]}</h1><p>${DESC[cur[0]]}</p></header>
      ${cur[0]==='clinics'&&html`<div class="sp-stack"><section class="sp-card"><div class="sp-card-h"><h4>Clinics <span class="count">${facs.length}</span></h4>${!adding&&html`<button class="btn pri sm" onClick=${()=>setAdding(true)}>${Icon('plus',14)} Add clinic</button>`}</div>
        ${adding&&html`<div class="sp-form"><div class="grid">
          <label class="field"><span class="lbl">Clinic name *</span><input id="nf-site" autofocus value=${nf.site} placeholder="e.g. Taylor Family Practice" onInput=${e=>{setNf({...nf,site:e.target.value});setErr('');}} onKeyDown=${e=>{if(e.key==='Enter')save();}}/></label>
          <label class="field"><span class="lbl">Organization</span><input value=${nf.clinic} placeholder="Optional" onInput=${e=>setNf({...nf,clinic:e.target.value})}/></label>
          <label class="field"><span class="lbl">Plexus coordinator</span><input value=${nf.coordinator} onInput=${e=>setNf({...nf,coordinator:e.target.value})}/></label>
          <label class="field"><span class="lbl">Target launch date</span><input type="date" value=${nf.target} onInput=${e=>setNf({...nf,target:e.target.value})}/></label></div>
          ${err&&html`<span class="sp-err">${err}</span>`}
          <div class="sp-form-a"><button class="link" onClick=${()=>{setAdding(false);setErr('');}}>Cancel</button><button class="btn pri sm" onClick=${save}>Add clinic and invite teams</button></div></div>`}
        ${facs.map(f=>html`<div class="sp-row" key=${f.id}><span class="av b">${Icon('building',15)}</span><span class="sp-l"><b>${f.site}</b><small>${[f.clinic!==f.site&&f.clinic,f.coordinator,f.target&&'Launch '+fmtD(f.target+'T12:00')].filter(Boolean).join(' · ')||'—'}</small></span><span class="sp-ctl"><button class="link" onClick=${()=>openClinic(f.id)}>Invite teams</button></span></div>`)}
      </section></div>`}
      ${cur[0]==='req'&&html`<${ReqEditor} s=${s} setS=${setS} mode="defaults" bare/>`}
      ${cur[0]==='rem'&&html`<${ReminderSettings} rem=${rem} setRem=${setRem}/>`}
      ${cur[0]==='users'&&html`<${UsersRoles} auth=${auth} who=${who}/>`}
    </section></div>`;
}
const SET_TABS=[['clinics','Clinics','clinics','building'],['req','Requirements','requirements','check'],['rem','Reminders','reminders','bell'],['users','Users & roles','users','users']];
function Console({s,st,setS,facs,fid,setFid,addFacility,openReview,auth,openInvite,who,initOpen}){
  const access=[...s.payers,...s.logins,...s.flows.labs,...s.clinicians.flatMap(c=>c.portals)].filter(a=>a.status!=='verified'&&(a.invite==='sent'||a.invite==='pending'||a.website||a.username||a.login)).length;
  const rows=facs.map(f=>{const fs=f.id===fid?s:loadFac(f.id);const fst=f.id===fid?st:status(fs);return {f,fs,fst};});
  const [adding,setAdding]=useState(false),[nf,setNf]=useState({site:'',clinic:'',coordinator:'',target:''}),[nfErr,setNfErr]=useState('');
  const saveNew=()=>{if(!nf.site.trim()){setNfErr('Enter the clinic name.');return;}if(facs.some(f=>f.site.toLowerCase()===nf.site.trim().toLowerCase())){setNfErr('A clinic with that name already exists.');return;}
    const id=addFacility({site:nf.site.trim(),clinic:nf.clinic.trim(),coordinator:nf.coordinator.trim(),target:nf.target});setSettings(null);setNf({site:'',clinic:'',coordinator:'',target:''});setNfErr('');setFid(id);setOpen(id);};
  const set=k=>e=>setS(p=>{const n=structuredClone(p);n.settings[k]=e.target.value.trim();return n;});
  const [open,setOpen]=useState(null),[reqOpen,setReqOpen]=useState(false),[panel,setPanel]=useState(null),[rem,setRemS]=useState(loadRem),[,force]=useState(0);
  const setRem=v=>{setRemS(v);jset(REM_KEY,v);};
  const sendReminder=(f,team,auto)=>{const plan=reminderPlan(f.id===fid?s:loadFac(f.id),team,rem);const entry={at:new Date().toISOString(),team,to:plan.to||[],auto:!!auto,by:auto?'Automatic':who};
    if(f.id===fid)setS(p=>{const n=structuredClone(p);n.reminders=[entry,...(n.reminders||[])];n.audit.unshift({t:new Date().toLocaleString(),who:entry.by,ev:`${team==='billing'?'Billing':'Clinic'} team reminder sent`,d:entry.to.join(', ')});return n;});
    else{const fs=loadFac(f.id);fs.reminders=[entry,...(fs.reminders||[])];fs.audit.unshift({t:new Date().toLocaleString(),who:entry.by,ev:`${team==='billing'?'Billing':'Clinic'} team reminder sent`,d:entry.to.join(', ')});lsSet(KEY+':'+f.id,JSON.stringify(fs));force(x=>x+1);}};
  useEffect(()=>{if(!rem.enabled)return;for(const f of facs){const fs=f.id===fid?s:loadFac(f.id);for(const t of ['clinic','billing']){const pl=reminderPlan(fs,t,rem);if(pl.state==='due'&&pl.overdue)sendReminder(f,t,true);}}},[]);
  const invs=id=>{const r=rows.find(x=>x.f.id===id);return r?((r.fs.invites||{})[r.fs.site]||{clinic:[],billing:[]}):{clinic:[],billing:[]};};
  const invBtn=f=>{const v=invs(f);return html`<button class=${'btn sm'+(open===f?' pri':'')} aria-expanded=${open===f} onClick=${()=>{if(open===f)setOpen(null);else{setFid(f);setOpen(f);}}}>${Icon('user',14)} Invite${v.clinic.length+v.billing.length?` · ${v.clinic.length} / ${v.billing.length}`:''}</button>`;};
  const invPanel=f=>f!==fid?null:html`<div class="panel invpanel" id="invpanel"><div class="row between"><h3>Invitations · ${s.site}</h3><button class="link" onClick=${()=>setOpen(null)}>Close</button></div><div class="invgrid">${['clinic','billing'].map(t=>html`<${InviteBox} key=${f+t} fac=${s.site} team=${t} list=${invs(f)[t]} setS=${setS} openInvite=${openInvite} who=${who}/>`)}</div></div>`;
  useEffect(()=>{if(initOpen){setFid(initOpen);setOpen(initOpen);}},[]);
  useEffect(()=>{if(open)document.getElementById('invpanel')?.scrollIntoView({block:'nearest',behavior:'smooth'});},[open]);
  return html`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h1>Clinic onboarding</h1></div>

  <div class="kpis"><div class="kpi"><b>${rows.length}</b><span>Clinics</span></div><div class="kpi"><b>${rows.reduce((a,r)=>a+r.fst.secs.filter(x=>['submitted','na'].includes(x.state)).length,0)}</b><span>Sections awaiting review</span></div><div class="kpi"><b>${rows.filter(r=>r.fst.secs.every(x=>x.complete)).length}</b><span>Fully complete</span></div><div class="kpi"><b>${rows.filter(r=>r.fst.stage===2).length}</b><span>Ready to launch</span></div></div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Facility / organization</th><th>Stage</th><th>Clinic team</th><th>Billing team</th><th>Outstanding</th><th>Access</th><th>Reminders</th><th>Coordinator</th><th></th></tr></thead><tbody>
    ${rows.map(({f,fs,fst})=>{const acc=[...fs.payers,...fs.logins].filter(a=>a.status!=='verified'&&(a.website||a.username||a.invited)).length;
      return html`<tr key=${f.id} class=${f.id===fid?'cur':''}><td><b style="font-weight:500">${fs.site}</b><div class="small muted">${fs.clinic} · ${fs.locations.length} location${fs.locations.length===1?'':'s'}</div></td><td><${Pill}>${['Clinic Completing','Plexus Reviewing','Ready to Launch'][fst.stage]}</${Pill}></td>
      ${[fst.secs.filter(x=>!BILLING_KEYS.includes(x.k)),fst.secs.filter(x=>BILLING_KEYS.includes(x.k))].map(g=>{const d=g.filter(x=>x.complete).length,sub=g.every(x=>['submitted','na','verified','waived'].includes(x.state));return html`<td><span class="mini"><span style=${`width:${Math.round(d/g.length*100)}%`}/></span>${d}/${g.length}${sub?html`<div class="small muted">Submitted</div>`:''}</td>`;})}
      <td>${fst.secs.filter(x=>!x.complete).length} sections</td><td>${acc}</td><td class="remcell">${['clinic','billing'].map(t=>{const pl=reminderPlan(fs,t,rem);return html`<div key=${t}><span class=${'rt '+t}>${t==='clinic'?'C':'B'}</span>${pl.state==='due'?html`${fmtD(pl.next)}${pl.count?html` <span class="muted">· ${pl.count} sent</span>`:''}${can(auth,'reminders')&&html` <button class="link" onClick=${()=>sendReminder(f,t,false)}>Send now</button>`}`:html`<span class="muted">${pl.label||'Off'}</span>`}</div>`;})}</td><td>${f.coordinator||'—'}${f.target?html`<div class="small muted">Launch ${new Date(f.target+'T12:00').toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}</div>`:''}</td>
      <td><div class="acts">${can(auth,'review')&&html`<button class="btn sm pri" onClick=${()=>openReview(f.id)}>Open review</button>`}${can(auth,'invite')&&invBtn(f.id)}</div></td></tr>`;})}
  </tbody></table></div></div>
  ${open&&invPanel(open)}`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
